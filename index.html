<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>放學後 After School</title>
  <style>
    :root {
      --bg: #F6F1E7;
      --surface: #FFFDF8;
      --ink: #1F1A17;
      --muted: #6B625A;
      --line: #E4DCCD;
      --highlight: #F5D547;
      --correct: #2F7A4B;
      --wrong: #C2412D;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    .shell {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      max-width: 720px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 3vw, 32px);
      line-height: 1.3;
      text-wrap: balance;
    }

    .muted {
      color: var(--muted);
      margin: 0 0 16px;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 16px;
      background: var(--bg);
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      background: var(--highlight);
      color: var(--ink);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    a.btn {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      background: var(--ink);
      color: var(--surface);
    }

    a.btn.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    a.btn:focus-visible {
      outline: 3px solid var(--highlight);
      outline-offset: 2px;
    }

    @media (min-width: 768px) {
      .shell {
        padding: 32px 24px 64px;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="shell">
    <section class="card">
      <h1>放學後 After School</h1>
      <p class="muted">放學後，才是真正的英文課。正在載入課程資料…</p>
    </section>
  </main>

  <script src="./data/english-2000-data.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
